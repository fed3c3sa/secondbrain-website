<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<title>Connect · SecondBrain</title>
<link rel="icon" href="/assets/favicon.png" />
<link rel="preconnect" href="https://esm.sh" />
<style>
  /* App theme tokens (mirror global.css) */
  :root{
    --bg-base:255 255 255; --bg-surface:248 248 248; --bg-elevated:240 240 240;
    --txt-primary:10 10 10; --txt-secondary:100 100 100; --txt-tertiary:160 160 160;
    --border:230 230 230; --primary:10 10 10; --primary-text:255 255 255;
    --brain-dark:1; --brain-light:0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg-base:0 0 0; --bg-surface:18 18 18; --bg-elevated:35 35 35;
      --txt-primary:245 245 245; --txt-secondary:160 160 160; --txt-tertiary:100 100 100;
      --border:45 45 45; --primary:245 245 245; --primary-text:0 0 0;
      --brain-dark:0; --brain-light:1;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:24px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:rgb(var(--bg-base)); color:rgb(var(--txt-primary));
    overflow:hidden;
  }
  /* Ambient brain watermark + glow */
  .ambient{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
  .ambient .glow{
    position:absolute; left:50%; top:38%; width:680px; height:680px; transform:translate(-50%,-50%);
    background:radial-gradient(closest-side, rgb(var(--txt-primary)/0.06), transparent 70%);
    filter:blur(6px); animation:pulse 7s ease-in-out infinite;
  }
  .ambient .brain{
    position:absolute; left:50%; top:42%; width:min(78vw,560px); transform:translate(-50%,-50%);
    opacity:.05; animation:float 12s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
  @keyframes float{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-14px)}}
  /* In-flow bob for the logo badge · no centering translate (that one is only for the absolutely-positioned ambient brain) */
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  .card{
    position:relative; z-index:1; width:100%; max-width:380px;
    background:rgb(var(--bg-surface)); border:1px solid rgb(var(--border));
    border-radius:28px; padding:36px 30px 26px;
    box-shadow:0 1px 0 rgb(255 255 255/0.03) inset, 0 24px 70px -30px rgb(0 0 0/0.55);
    text-align:center; animation:rise .6s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise{from{opacity:0; transform:translateY(14px) scale(.985)}to{opacity:1; transform:none}}

  .logo{
    width:84px;height:84px;margin:0 auto 22px;position:relative;
    display:grid;place-items:center;
    border-radius:24px;
    background:rgb(var(--bg-elevated));
    border:1px solid rgb(var(--border));
    box-shadow:0 1px 0 rgb(255 255 255/0.05) inset, 0 14px 30px -16px rgb(0 0 0/0.55);
    animation:bob 9s ease-in-out infinite;
  }
  .logo img{width:50px;height:50px;object-fit:contain}
  .logo .ld{opacity:var(--brain-dark)}
  .logo .ll{opacity:var(--brain-light);position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}

  h1{font-size:25px;line-height:1.1;letter-spacing:-.02em;margin:0 0 7px;font-weight:700}
  .sub{font-size:14.5px;line-height:1.5;color:rgb(var(--txt-secondary));margin:0 auto 24px;max-width:300px}

  .btns{display:flex;flex-direction:column;gap:11px}
  button{
    width:100%; height:54px; border-radius:15px; font-size:16px; font-weight:600; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:11px;
    border:1px solid transparent; transition:transform .12s ease, background .15s ease, border-color .15s ease, opacity .15s;
    font-family:inherit;
  }
  button:active{transform:scale(.985)}
  button svg{width:19px;height:19px;flex:0 0 auto}
  .btn-apple{background:rgb(var(--primary));color:rgb(var(--primary-text));}
  .btn-apple:hover{opacity:.9}
  .btn-google{background:rgb(var(--bg-base));color:rgb(var(--txt-primary));border-color:rgb(var(--border));}
  .btn-google:hover{background:rgb(var(--bg-elevated))}
  .btn-apple svg{fill:rgb(var(--primary-text))}

  .foot{margin-top:20px;font-size:12px;color:rgb(var(--txt-tertiary));display:flex;align-items:center;justify-content:center;gap:6px}
  .foot svg{width:12px;height:12px;opacity:.8}

  .hidden{display:none!important}
  .spinner{width:30px;height:30px;margin:10px auto 16px;border-radius:50%;
    border:3px solid rgb(var(--txt-primary)/0.12); border-top-color:rgb(var(--txt-primary)); animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .emoji{font-size:40px;line-height:1;margin-bottom:8px}
  .muted{color:rgb(var(--txt-secondary));font-size:14px;line-height:1.5;margin:6px 0 0}
  a{color:rgb(var(--txt-primary));font-weight:600}
  .err{color:rgb(220 38 38)}
</style>
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="glow"></div>
    <img class="brain" src="/assets/brain-icon-light.png" alt="" onerror="this.style.display='none'"/>
  </div>

  <main class="card">
    <div class="logo">
      <img class="ld" src="/assets/brain-icon-dark.png" alt="SecondBrain" onerror="this.style.opacity=0"/>
      <img class="ll" src="/assets/brain-icon-light.png" alt="" aria-hidden="true" onerror="this.style.opacity=0"/>
    </div>

    <div id="choose" class="hidden">
      <h1>SecondBrain</h1>
      <p class="sub">Connect your assistant to your second brain. Sign in to continue.</p>
      <div class="btns">
        <button id="apple" class="btn-apple">
          <svg viewBox="0 0 384 512"><path d="M318.7 268c-.3-37 16.4-65 50.3-85.6-19-27.2-47.5-42.2-85.4-45.2-35.9-2.8-75 21-89.3 21-15 0-49.7-20-76.7-20C61.7 138.6 0 184.5 0 277.9c0 27.6 5 56.1 15.1 85.4 13.5 38.5 62.3 132.9 113.2 131.4 26.6-.6 45.4-18.9 80-18.9 33.6 0 51 18.9 80.6 18.9 51.3-.7 95.4-86.5 108.3-125.1-68.8-32.4-65.3-95-65.3-95.6zM258.4 96.1c29.2-34.6 26.5-66.1 25.7-77.4-26.7 1.5-57.5 18.2-75 38.7-19.3 21.9-30.6 49-28.2 80.9 28.9 2.2 55.2-12.7 77.5-42.2z"/></svg>
          Continue with Apple
        </button>
        <button id="google" class="btn-google">
          <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continue with Google
        </button>
      </div>
      <p class="foot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Private &amp; secure · Pro
      </p>
    </div>

    <div id="busy" class="hidden">
      <div class="spinner"></div>
      <h1 id="busyTitle">Signing you in…</h1>
      <p class="muted" id="busyText">One moment.</p>
    </div>

    <div id="done" class="hidden">
      <div class="emoji" id="doneEmoji">✅</div>
      <h1 id="doneTitle">You're connected</h1>
      <p class="muted" id="doneText">Return to your assistant and continue. You can close this tab.</p>
    </div>

    <div id="error" class="hidden">
      <div class="emoji">⚠️</div>
      <h1>Hmm, that didn't work</h1>
      <p class="muted err" id="errorText">Something went wrong.</p>
    </div>
  </main>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://ntykytpngslkytfyuaee.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50eWt5dHBuZ3Nsa3l0Znl1YWVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwMzE1ODYsImV4cCI6MjA5MTYwNzU4Nn0.H8-o0luMghqeJltLOxg4hjhzyniDiTu9zA5fehCntJw';

const supabase = createClient(SUPABASE_URL, ANON_KEY, {
  auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true },
});

// Carry the device code across the OAuth redirect in sessionStorage, NOT in the
// URL, so redirectTo stays a clean `.../connect/` that matches the Supabase
// Redirect URLs allowlist exactly.
const dc = new URLSearchParams(location.search).get('dc') || sessionStorage.getItem('sb_dc');

// OAuth-authorize mode (cloud MCP clients like Claude Cowork / claude.ai).
// The edge /oauth/authorize endpoint bounces the browser here with the OAuth
// request in the query; we carry it across the Supabase redirect in
// sessionStorage so redirectTo stays the clean, allow-listed /connect/ URL.
function readOauthCtx() {
  const p = new URLSearchParams(location.search);
  if (p.get('sb_oauth') === '1' && p.get('client_id') && p.get('redirect_uri') && p.get('code_challenge')) {
    return {
      client_id: p.get('client_id'),
      redirect_uri: p.get('redirect_uri'),
      code_challenge: p.get('code_challenge'),
      state: p.get('state') || '',
      scope: p.get('scope') || '',
      resource: p.get('resource') || '',
    };
  }
  try { return JSON.parse(sessionStorage.getItem('sb_oauth_ctx') || 'null'); } catch { return null; }
}
const oauthCtx = readOauthCtx();

const $ = (id) => document.getElementById(id);
const show = (id) => { for (const s of ['choose', 'busy', 'done', 'error']) $(s).classList.toggle('hidden', s !== id); };
const fail = (msg) => { $('errorText').textContent = msg; show('error'); };

// Render "message + upgrade link" without innerHTML so a compromised or
// misbehaving backend response can never inject markup/script (XSS hardening).
function renderUpgradeMessage(el, message, upgradeUrl) {
  el.textContent = '';
  el.append(document.createTextNode(message || 'Upgrade to SecondBrain Pro to connect.'));
  let href = '';
  try {
    const u = new URL(upgradeUrl, location.origin);
    if (['https:', 'http:', 'secondbrain:'].includes(u.protocol)) href = u.toString();
  } catch { /* ignore malformed URLs */ }
  if (href) {
    el.append(document.createElement('br'), document.createElement('br'));
    const a = document.createElement('a');
    a.href = href;
    a.rel = 'noopener';
    a.textContent = 'Open SecondBrain to upgrade';
    el.append(a);
  }
}

const redirectTo = `${location.origin}${location.pathname}`;

async function signIn(provider) {
  $('busyTitle').textContent = 'Redirecting…';
  $('busyText').textContent = `Continue with ${provider === 'apple' ? 'Apple' : 'Google'} in the next screen.`;
  show('busy');
  if (dc) sessionStorage.setItem('sb_dc', dc);
  if (oauthCtx) sessionStorage.setItem('sb_oauth_ctx', JSON.stringify(oauthCtx));
  const { error } = await supabase.auth.signInWithOAuth({ provider, options: { redirectTo } });
  if (error) fail(error.message);
}

async function bind(session) {
  $('busyTitle').textContent = 'Connecting your assistant…';
  $('busyText').textContent = 'Almost done.';
  show('busy');
  const res = await fetch(`${SUPABASE_URL}/functions/v1/mcp-connect`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ action: 'bind', device_code: dc }),
  });
  const json = await res.json().catch(() => ({}));
  await supabase.auth.signOut().catch(() => {});
  sessionStorage.removeItem('sb_dc');

  if (res.status === 403 && json.error === 'pro_required') {
    $('doneEmoji').textContent = '🔒';
    $('doneTitle').textContent = 'One step left';
    renderUpgradeMessage($('doneText'), json.message, json.upgrade_url);
    show('done');
    return;
  }
  if (!res.ok || !json.ok) { fail(json.error || 'Could not connect. Please try again from your assistant.'); return; }
  show('done');
}

// OAuth-authorize completion: after sign-in, mint an authorization code and
// redirect the browser back to the MCP client (Cowork / claude.ai).
async function completeOauth(session) {
  $('busyTitle').textContent = 'Connecting your assistant…';
  $('busyText').textContent = 'Almost done.';
  show('busy');
  const res = await fetch(`${SUPABASE_URL}/functions/v1/oauth/issue-code`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: ANON_KEY, Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({
      client_id: oauthCtx.client_id,
      redirect_uri: oauthCtx.redirect_uri,
      code_challenge: oauthCtx.code_challenge,
      scope: oauthCtx.scope,
      resource: oauthCtx.resource,
    }),
  });
  const data = await res.json().catch(() => ({}));
  await supabase.auth.signOut().catch(() => {});
  sessionStorage.removeItem('sb_oauth_ctx');

  if (res.status === 403 && data.error === 'pro_required') {
    $('doneEmoji').textContent = '🔒';
    $('doneTitle').textContent = 'One step left';
    renderUpgradeMessage($('doneText'), data.message, data.upgrade_url);
    show('done');
    return;
  }
  if (!res.ok || !data.code) {
    fail(data.error_description || data.error || 'Could not connect. Please try again from your assistant.');
    return;
  }
  const back = new URL(oauthCtx.redirect_uri);
  back.searchParams.set('code', data.code);
  if (oauthCtx.state) back.searchParams.set('state', oauthCtx.state);
  location.replace(back.toString());
}

async function main() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session && oauthCtx) { await completeOauth(session); return; }
  if (session && dc) { await bind(session); return; }
  if (session && !dc && !oauthCtx) {
    // Signed in but opened without a device code · nothing to bind.
    $('doneEmoji').textContent = '✅';
    $('doneTitle').textContent = "You're signed in";
    $('doneText').textContent = 'Open this page from your assistant to finish connecting.';
    show('done');
    return;
  }
  if (!dc && !oauthCtx) {
    fail('Open this link from your assistant (it carries a one-time code), or run <code>npx @secondbrain/connect</code> in a terminal.');
    return;
  }
  $('google').onclick = () => signIn('google');
  $('apple').onclick = () => signIn('apple');
  show('choose');
}

main().catch((e) => fail(e.message));
</script>
</body>
</html>
